{% extends "base.html" %}

{% block title %}Accedi - Telemedicina{% endblock %}
{% block header %}Telemedicina{% endblock %}

{% block content %}
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-head">
                <span class="brand-mark">🏥</span>
                <h2>Accedi</h2>
                <p>Portale di telemedicina per la gestione del diabete</p>
            </div>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="post" action="{{ url_for('auth.login') }}">
                <label>
                    Username
                    <input type="text" name="username" required autofocus placeholder="Il tuo nome utente">
                </label>
                <label>
                    Password
                    <input type="password" name="password" required placeholder="La tua password">
                </label>
                <button type="submit">Accedi</button>
            </form>
        </div>
    </div>
{% endblock %}
